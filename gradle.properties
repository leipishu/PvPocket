# Gradle
# Loom 1.11 needs the daemon on JDK 21. Point this at another install, or set JAVA_HOME instead.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Toolchains are resolved only from these paths. Gradle's registry probe misses jdk-17 here, and
# the 1.20.1 cell needs it, so nothing is left to auto-detection.
org.gradle.java.installations.paths=C:\\Program Files\\Java\\jdk-17,C:\\Program Files\\Java\\jdk-21,C:\\Program Files\\Java\\jdk-27

# Loom download sources. The BMCLAPI mirror redirects to a host whose certificate chain fails JDK
# validation (PKIX path building failed), so the official sources are used.
loom_libraries_base=https://libraries.minecraft.net/
loom_resources_base=https://resources.download.minecraft.net/
loom_version_manifests=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

# Mod metadata
mod_id=pvpocket
mod_name=PvPocket
mod_version=0.1.0
maven_group=com.leipishu
