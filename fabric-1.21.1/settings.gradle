pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'pvpocket-fabric-1.21.1'

// 两个加载器是同一个根下的两个项目，因为 Loom 与 ModDevGradle 不能应用在同一个 project 上——
// 两者都要接管 minecraft 依赖与 run 任务。根项目仍然是 Fabric 那一格（沿用原来的 build.gradle），
// NeoForge 作为子项目借用同一份 src/。
//
// 这样做的代价是根目录名还叫 fabric-1.21.1，与内容不再一致。改名（`fabric-1.21.1/` → `1.21.1/`）
// 是一次纯机械的 git mv 加十几处脚本路径，等第二个版本出现时一并做，不值得现在打断验证。
include 'neoforge'
