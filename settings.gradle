pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'pvpocket'

// One catalog file per Minecraft version: gradle/catalogs/<mc>.toml becomes catalog `v<mc>` with
// dots turned into underscores (1.21.1 -> v1_21_1). Key names inside each file stay identical.
def catalogsDir = file('gradle/catalogs')
catalogsDir.listFiles()
        ?.findAll { it.name.endsWith('.toml') }
        ?.sort { it.name }
        ?.each { catalogFile ->
            def mc = catalogFile.name.substring(0, catalogFile.name.length() - '.toml'.length())
            def catalogName = 'v' + mc.replaceAll('[^0-9A-Za-z]', '_')
            dependencyResolutionManagement.versionCatalogs.create(catalogName) {
                // from() expects a dependency notation, so the file needs the files(...) wrapper.
                from(files(catalogFile))
            }
        }

// A cell is one Minecraft version plus one loader, and one cell is one subproject. The project
// path is flattened to a single segment so task names stay short: :1.21.1-fabric:runClient
def cells = [
        '1.21.1-fabric',
        '1.21.1-neoforge',
        '1.21.11-fabric',
        '1.21.11-neoforge',
]

cells.each { cell ->
    include ":$cell"
    project(":$cell").projectDir = file("versions/$cell")
}
