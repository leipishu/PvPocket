// Root project: shared repositories only. No loader plugin is applied here, so no jar is produced,
// because a loader has to own a whole project and those live in versions/<cell> (see settings).

allprojects {
    repositories {
        mavenCentral()
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every cell (versions/<cell>).'
    dependsOn subprojects.collect { "${it.path}:build" }
}
