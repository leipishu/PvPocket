# Minecraft 1.21.1 catalog, registered as v1_21_1 by settings.gradle.
# Key names are identical in every catalog file; the catalog name is what tells versions apart.

[versions]
minecraft = "1.21.1"
# Both of these carry the MC version inside their own version string.
fabricApi = "0.116.17+1.21.1"
neoforge = "21.1.265"
# Read by scripts/mojmap/mojmap-table.py only, never by the build.
yarn = "1.21.1+build.3"
