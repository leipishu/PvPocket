modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0-only"

[[mods]]
modId = "pvpocket"
version = "${file.jarVersion}"
displayName = "PvPocket"
displayTest = "MATCH_VERSION"
description = '''
Isolated duel sessions for SMP servers: custom loadouts, best-of-N rounds, per-round Legacy 1.8 combat, and a full restore of survival state afterwards.
'''
logoFile = "assets/pvpocket/icon.png"
authors = "leipishu"

# 两个 mixin 配置：一个服务端与客户端共用，一个只对客户端生效。
#
# 与 Fabric 的差别：Fabric 在 fabric.mod.json 里给配置标 `"environment": "client"`，加载器自己
# 决定不加载；NeoForge 没有这个字段，所以那份配置里的每个 mixin 都写在 JSON 的 `client` 数组里，
# 由 Mixin 自己按 side 跳过。效果相同，位置不同。
[[mixins]]
config = "pvpocket.mixins.json"

[[mixins]]
config = "pvpocket.client.mixins.json"

[[dependencies.pvpocket]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.pvpocket]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"
