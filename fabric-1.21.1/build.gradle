plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "pvpocket" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // Four dev clients plus a dedicated server as the shared room. Each one is a Gradle task —
    // runClient, runClient2..runClient4, runServer — so it can be launched from IDEA's Gradle tool
    // window (Tasks > fabric) without a terminal and without a run configuration to maintain.
    //
    // Every run directory lives under runs/ so the project root stays readable; each one is still a
    // separate directory, which is mandatory rather than cosmetic:
    //   - Minecraft writes logs/latest.log with a rolling file appender. Two JVMs in one directory
    //     fight over the same file and the loser silently loses its log, which is the main debug
    //     surface for this project.
    //   - options.txt, saves, resource index and screenshots all collide as well.
    // Distinct usernames are equally mandatory: the dev client otherwise logs in as the OS user,
    // so both clients would be the same player and the second join would be rejected.
    runs {
        client {
            client()
            configName = "Minecraft Client (Dev1)"
            runDir "runs/client1"
            // 1280x720 is the smallest window that still exercises the panel at a realistic GUI
            // scale; the default dev window lands around 427x240 virtual pixels, where every
            // layout is in its most cramped branch and screenshots are unreadable.
            programArgs "--username", "Dev1", "--width", "1280", "--height", "720"
        }
        client2 {
            client()
            configName = "Minecraft Client (Dev2)"
            runDir "runs/client2"
            programArgs "--username", "Dev2", "--width", "1280", "--height", "720"
        }
        // A third client exists for one reason: spectating cannot be tested with two players, because
        // both of them are in the duel. Three JVMs is heavy, so it is opt-in — nothing starts it
        // unless it is launched on purpose (runClient3 in the Gradle panel, or PVP_CLIENTS=3 on
        // scripts/dev-2clients.sh).
        client3 {
            client()
            configName = "Minecraft Client (Dev3)"
            runDir "runs/client3"
            programArgs "--username", "Dev3", "--width", "1280", "--height", "720"
        }
        // A fourth exists for the one scenario three cannot express: two duels running at the same
        // time. With Dev1+Dev2 in one duel, a second duel needs two free players, and Dev3 alone is
        // one. Only used to check that a map already in use cannot be picked again.
        client4 {
            client()
            configName = "Minecraft Client (Dev4)"
            runDir "runs/client4"
            programArgs "--username", "Dev4", "--width", "1280", "--height", "720"
        }
        server {
            server()
            configName = "Minecraft Server (shared room)"
            runDir "runs/server"
        }
    }
}

// 源码分四处，各管一段：
//
//   src/main/java          所有加载器共用（服务端那一半）。**这里不许出现 net.fabricmc**。
//   src/fabric/java        Fabric 的服务端入口与平台实现。NeoForge 那一格换成 src/neoforge/java。
//   src/client/java        客户端里与加载器无关的部分：界面、HUD、渲染、镜像。
//   src/client-fabric/java 客户端的加载器接线。NeoForge 那一格换成 src/client-neoforge/java。
//
// 判据只有一条：这段代码要 import net.fabricmc 吗？要就进 src/*-fabric，不要就留在不带后缀的那
// 一层。这条判据决定移植一格的代价是「写一个实现类」还是「重写一遍」，所以它得是能机械判定的，
// 不能靠「跟谁关系近」——`scripts/check-boundary.py` 就是它的执行版本。
//
// 目录分了，但**仍是同一个 source set**：多一个 source set 就要额外处理 jar 打包与 remap，
// 而这里要的只是"文件放对地方"，不是"编译期隔离"（隔离由边界检查保证）。
sourceSets {
    main {
        java.srcDir 'src/fabric/java'
        resources.srcDir 'src/fabric/resources'
    }
    client {
        java.srcDir 'src/client-fabric/java'
        resources.srcDir 'src/client-fabric/resources'
    }
}

// Every dev client starts already connected to the shared room and with a capped heap, with no
// -P flags. Both used to be opt-in properties, which made the tasks in IDEA's Gradle panel
// half-configured: runClient launched from the panel landed on the title screen and asked the JVM
// for two gigabytes. A dev client that has to be configured before it is useful is a dev client
// nobody launches from the panel.
//
// Overrides: -PquickJoin=<host:port> points elsewhere, -PquickJoin=off leaves the client at the
// title screen (for when the room is down), -PclientHeap=<size> raises the cap.
def quickJoin = project.hasProperty("quickJoin")
        ? project.property("quickJoin").toString()
        : "localhost:25565"
def clientHeap = project.hasProperty("clientHeap")
        ? project.property("clientHeap").toString()
        : "1G"

// Data generation is a client run as far as Loom is concerned, but it never opens a window and
// must not be told to connect to a server; it is the one client run that is not a dev client.
def devClient = { run -> run.environment == "client" && run.name != "datagen" }

loom.runs.configureEach { run ->
    if (devClient(run)) {
        if (quickJoin != "off" && !quickJoin.isEmpty()) {
            run.programArgs("--quickPlayMultiplayer", quickJoin)
        }
        run.vmArg "-Xmx${clientHeap}".toString()
        // -PdebugBlocking forces this client to report itself as blocking a sword, so the first and
        // third person poses can be inspected without setting up a legacy duel. Applied to the
        // local mirror only — see MinecraftClientMixin.DEBUG_BLOCKING.
        if (project.hasProperty("debugBlocking")) {
            run.vmArg "-Dpvpocket.debug.blocking=true"
        }
    }
}

// -PuiAudit runs the layout audit instead of a game session: the client opens every panel, page and
// dialog at two canvas sizes, reports the rectangles that collide, and quits. scripts/audit-ui.sh
// wraps it and fails on any finding, which is how a layout regression is caught without a human
// opening eight pages at two window sizes.
if (project.hasProperty("uiAudit")) {
    loom.runs.configureEach { run ->
        if (devClient(run)) {
            run.vmArg "-Dpvpocket.audit=true"
            run.vmArg "-Dpvpocket.audit.exit=true"
        }
    }
}

// -PmixinDebug exports every transformed class to <runDir>/.mixin.out/class/ and makes Mixin log
// each applied injection. This mod rewrites hot paths inside PlayerEntity#attack, where "no exception
// at startup" only proves a target matched, not that the right one did — javap the exported class to
// confirm. Off by default because the export costs startup time and a lot of disk.
if (project.hasProperty("mixinDebug")) {
    loom.runs.configureEach { run ->
        run.vmArg "-Dmixin.debug.export=true"
        run.vmArg "-Dmixin.debug.verbose=true"
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

// Loom's data-generation run is a child of the client run, so it inherits the dev client's username,
// window size and auto-join. It opens no window and must not try to connect anywhere, so its program
// arguments are cleared back to nothing — it only needs the -Dfabric-api.datagen system properties
// that Loom adds itself.
loom.runs.named("datagen") { it.programArgs.clear() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 官方映射（Mojmap），不是 Yarn。
    //
    // 26.1 起 Minecraft 不再混淆，官方名成了运行时里真实存在的名字，也是唯一一套不会随加载器过期的
    // 命名；Yarn 是社区映射，只能跟着官方名翻译。要一份源码同时喂 Fabric / NeoForge / Forge，
    // 就必须统一到官方名——NeoForge 本来就只认它。
    //
    // 代价是源码里全是 `net.minecraft.world.level.Level` 这种长名字，收益是它到 26.x 都不会再变。
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// The licence ships inside the jar, not only beside it.
//
// LGPL-3.0 §4 asks that anyone who receives the object code also receive a copy of the licence, and
// it builds on GPL-3.0 §1, which asks the same. A LICENSE file in the repository does not satisfy
// that: what gets distributed is the jar — people drop it into a modpack folder, and a modpack author
// never sees this repository. So the three legal files go in at the jar root, where an unzip shows
// them and where a licence scanner looks first.
//
// The paths are one level up because the Gradle build sits inside the repository (`fabric-1.21.1/`)
// rather than at its root — the docs, the changelog and the licences live above it.
def legalRoot = project.rootDir.parentFile
def legalFiles = ["LICENSE", "LICENSE-GPL-3.0.txt", "THIRD-PARTY-NOTICES.md"]
legalFiles.each { name ->
    def file = new File(legalRoot, name)
    if (!file.isFile()) {
        // Failing here rather than shipping a jar without it: a release that silently loses its
        // licence is a release nobody notices is out of compliance.
        throw new GradleException("missing ${file} — the jar has to ship a copy of the licence")
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }

    from(legalFiles.collect { new File(legalRoot, it) })
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName
}

// Self-checks that need no Minecraft runtime, only the compiled classes.
//
// `./gradlew statsCheck` — the stats files are the one thing here whose bugs are permanent (a
// duplicated history row, a cap that drops the newest instead of the oldest), and checking them by
// playing two hundred matches is not a test. Same shape as PvRaster's self-check, but wired into
// Gradle so it is one command instead of a hand-built classpath.
tasks.register("statsCheck", JavaExec) {
    group = "verification"
    description = "Runs the duel-stats self-check against a temporary directory."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.leipishu.pvpocket.stats.DuelStatsCheck"
}
