# Gradle
# Loom 1.11 要求 Gradle 守护进程运行在 JDK 21 上。换机器或接入 CI 时修改此行，
# 或改为在环境中设置 JAVA_HOME 指向 JDK 21 并删除本行。
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.9
loom_version=1.11.8
fabric_version=0.116.17+1.21.1

# Loom 下载源
# 曾尝试 BMCLAPI 国内镜像，但其资源与 maven 请求都会 302 到
# *.sakura.sld.tw 的下载节点，该节点证书链无法通过 JDK 校验
# （PKIX path building failed），因此这里保留官方源。
# 如需启用镜像，取消下面四行注释并注释掉官方源：
#   loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
#   loom_resources_base=https://bmclapi2.bangbang93.com/assets/
#   loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest.json
#   loom_experimental_versions=https://maven.fabricmc.net/net/minecraft/experimental_versions.json
loom_libraries_base=https://libraries.minecraft.net/
loom_resources_base=https://resources.download.minecraft.net/
loom_version_manifests=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

# Mod metadata
mod_id=pvpocket
mod_name=PvPocket
mod_version=0.1.0
maven_group=com.leipishu
archives_base_name=pvpocket-fabric-1.21.1
