// Root project: shared repositories only. No loader plugin is applied here, so no jar is produced,
// because a loader has to own a whole project and those live in versions/<cell> (see settings).

allprojects {
    repositories {
        mavenCentral()
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every cell (versions/<cell>) and collects the jars into dist/.'
    dependsOn subprojects.collect { "${it.path}:build" }
    doLast {
        def dist = rootProject.file('dist')
        println "产物（dist/）："
        subprojects.sort { it.name }.each { cell ->
            def dir = new File(dist, cell.name)
            def jars = dir.isDirectory() ? (dir.listFiles() ?: new File[0]) : new File[0]
            jars.findAll { it.name.endsWith('.jar') }.sort { it.name }.each {
                println "  ${cell.name}/${it.name}"
            }
        }
    }
}
