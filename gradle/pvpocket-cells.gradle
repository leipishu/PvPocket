// Shared half of versions/<cell>/build.gradle: everything that does not depend on the loader.
// Cells on 26.x set ext.pvpocketJavaVersion = 25 before applying this file; default is 21.
def javaLevel = (project.findProperty('pvpocketJavaVersion') ?: 21) as int

// Catalog name is derived from the cell name (1.21.1-fabric -> v1_21_1), never written by hand.
// findVersion is used because the generated `catalog.versions.*` accessors exist only on `libs`.
def pickVersion = { String catalogName, String alias ->
    project.versionCatalogs.named(catalogName)
            .findVersion(alias)
            .orElseThrow {
                new GradleException("no version '$alias' in catalog '$catalogName' "
                        + "(see gradle/catalogs/ and gradle/libs.versions.toml)")
            }
            .requiredVersion
}

def cellCatalogName = 'v' + project.name.split('-')[0].replaceAll('[^0-9A-Za-z]', '_')

ext.minecraft_version = pickVersion(cellCatalogName, 'minecraft')
ext.fabric_version = pickVersion(cellCatalogName, 'fabricApi')
ext.neoforge_version = pickVersion(cellCatalogName, 'neoforge')
// fabric-loader is shared across MC versions, so it normally lives in the default catalog. A newer
// MC version can need a newer loader, so its own catalog may carry a `loader` key that wins here.
ext.loader_version = project.versionCatalogs.named(cellCatalogName)
        .findVersion('loader')
        .map { it.requiredVersion }
        .orElseGet { pickVersion('libs', 'fabricLoader') }

group = project.maven_group
version = project.mod_version

// Version port: set ext.pvpocketPort before applying this file, then read source roots through
// pvpocketSrc(...) rather than rootProject.file('src/...').
def portVersion = project.findProperty('pvpocketPort')
// Beside build.gradle, not under build/: the generated tree is source. An IDE excludes buildDir, so
// a tree inside it has no icons, no navigation and no search, which makes the ported cell unusable.
def portOutput = new File(projectDir, 'gen-src')
def portTask = null
if (portVersion) {
    portTask = tasks.register('generatePortSources', Exec) {
        group = 'build'
        description = "Generates gen-src/ from src/ for Minecraft ${portVersion}."
        inputs.dir(rootProject.file('src'))
        inputs.file(rootProject.file('scripts/port/gen.py'))
        inputs.file(rootProject.file("scripts/port/${portVersion}.tsv"))
        outputs.dir(portOutput)
        // PYTHON overrides the interpreter, same as the scripts/ entry points.
        def pythonBin = System.getenv('PYTHON') ?: 'python'
        commandLine pythonBin, rootProject.file('scripts/port/gen.py').absolutePath,
                '--mc', portVersion,
                '--src', rootProject.file('src').absolutePath,
                '--out', portOutput.absolutePath,
                '--table', rootProject.file("scripts/port/${portVersion}.tsv").absolutePath
    }
    tasks.withType(JavaCompile).configureEach { dependsOn portTask }
    // Every task that reads a source root has to wait for the tree to be written: Gradle rejects
    // an undeclared read of a task output, and the resource roots live in the generated tree too.
    tasks.matching {
        it.name in ['processResources', 'processClientResources', 'sourcesJar', 'jar']
    }.configureEach { dependsOn portTask }
    // clean removes buildDir only, and the tree lives outside it.
    tasks.matching { it.name == 'clean' }.configureEach { delete portOutput }
}

// Source root: src/<relative> for the canonical cell, gen-src/<relative> for a ported one.
ext.pvpocketSrc = { String relative ->
    portVersion ? new File(portOutput, relative) : rootProject.file("src/${relative}")
}

// Every subproject inherits the default roots versions/<cell>/src/<set>/<kind>. Sources are shared
// at the repository root, so those never exist and an IDE shows an empty module. Drop just those.
afterEvaluate {
    project.sourceSets.each { sourceSet ->
        ['java', 'resources'].each { kind ->
            def dirs = sourceSet."${kind}"
            // Compare normalised paths: a File built from a string keeps backslashes on Windows and
            // never equals the entry Gradle stored with forward slashes.
            def defaultDir = project.file("src/${sourceSet.name}/${kind}").absolutePath.replace('\\', '/')
            // srcDirs hands out a copy, so setSrcDirs is the only way to remove an entry.
            def kept = dirs.srcDirs.findAll { it.absolutePath.replace('\\', '/') != defaultDir }
            if (kept.size() != dirs.srcDirs.size()) {
                dirs.setSrcDirs(kept)
            }
        }
    }
}

// Archive name is derived from the cell name: 1.21.1-fabric -> pvpocket-fabric-1.21.1.
def cellParts = project.name.split('-')
base {
    archivesName = "pvpocket-${cellParts[1]}-${cellParts[0]}"
}

// One place to look for a finished jar: dist/<cell>/ at the repository root. Sync, not Copy, so a
// jar that disappears from build/libs disappears here too; Fabric keeps its dev jar in devlibs/.
def collectDist = tasks.register('collectDist', Sync) {
    group = 'build'
    description = "Copies the redistributable jars into dist/${project.name}/."
    into rootProject.layout.projectDirectory.dir("dist/${project.name}")
    from(layout.buildDirectory.dir('libs')) {
        include '*.jar'
    }
}
tasks.named('assemble') { finalizedBy collectDist }
// clean removes buildDir only, so the collected jars would survive it and the next build would
// leave a stale one behind.
tasks.matching { it.name == 'clean' }.configureEach {
    delete rootProject.file("dist/${project.name}")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaLevel)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaLevel
    // javac stops at 100 errors by default, which hides the size of a version port. Show them all.
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

// The licence files go into the jar root: LGPL-3.0 section 4 requires shipping a copy with the
// object code, and the jar is what gets redistributed, not this repository.
def legalFiles = ['LICENSE', 'LICENSE-GPL-3.0.txt', 'THIRD-PARTY-NOTICES.md']
legalFiles.each { name ->
    def file = rootProject.file(name)
    if (!file.isFile()) {
        throw new GradleException("missing ${file} — the jar has to ship a copy of the licence")
    }
}
tasks.named('processResources') {
    from(legalFiles.collect { rootProject.file(it) })
}

// Dev clients: one server plus four clients. Each needs its own run dir and username, because two
// JVMs in one dir fight over logs/latest.log and a duplicate username is refused by the server.
ext.pvpocketDevClients = [
        [name: 'client',  dir: 'client1', user: 'Dev1'],
        [name: 'client2', dir: 'client2', user: 'Dev2'],
        [name: 'client3', dir: 'client3', user: 'Dev3'],
        [name: 'client4', dir: 'client4', user: 'Dev4'],
]

// 1280x720 is the smallest window that still reaches the tightest panel layout branches.
ext.pvpocketClientArgs = { String user ->
    ['--username', user, '--width', '1280', '--height', '720']
}

// Override with -PquickJoin=<host:port>, or -PquickJoin=off to stay on the title screen.
ext.pvpocketQuickJoin = project.hasProperty('quickJoin')
        ? project.property('quickJoin').toString()
        : 'localhost:25565'
ext.pvpocketClientHeap = project.hasProperty('clientHeap')
        ? project.property('clientHeap').toString()
        : '1G'

// Run dirs are per cell (runs/<cell>/<run>): save formats differ between versions, never share one.
ext.pvpocketRunDir = { String dir ->
    rootProject.file("runs/${project.name}/${dir}")
}
// ModDevGradle wants a File for gameDirectory; Loom's runDir takes a String relative to projectDir
// and rejects a File or an absolute path, hence the relativize helper.
ext.pvpocketRunDirRelative = { String dir ->
    project.projectDir.toPath()
            .relativize(pvpocketRunDir(dir).toPath())
            .toString()
}

// Client JVM flags that do not depend on the loader; each cell passes them in its own way.
ext.pvpocketClientJvmArgs = {
    def args = ["-Xmx${pvpocketClientHeap}".toString()]
    // -PdebugBlocking: the client reports itself as blocking, so the pose needs no duel.
    if (project.hasProperty('debugBlocking')) {
        args << '-Dpvpocket.debug.blocking=true'
    }
    // -PuiAudit: walks every panel at two canvas sizes, reports overlaps, exits; see check-ui.sh.
    if (project.hasProperty('uiAudit')) {
        args << '-Dpvpocket.audit=true' << '-Dpvpocket.audit.exit=true'
    }
    // -PmixinDebug: exports rewritten classes to <runDir>/.mixin.out/ and logs every injection.
    if (project.hasProperty('mixinDebug')) {
        args << '-Dmixin.debug.export=true' << '-Dmixin.debug.verbose=true'
    }
    args
}

// Writes the compile classpath to build/compile-classpath.txt for scripts/check-logic.sh, which
// compiles probes against the real classes and needs the exact compile-time classpath.
tasks.register('writeCompileClasspath') {
    group = 'verification'
    description = 'Writes the compile classpath to build/compile-classpath.txt.'
    def clientSourceSet = sourceSets.findByName('client')
    def classpath = clientSourceSet == null
            ? files(sourceSets.main.compileClasspath)
            : files(sourceSets.main.compileClasspath, clientSourceSet.compileClasspath)
    def output = layout.buildDirectory.file('compile-classpath.txt')
    outputs.file(output)
    doLast {
        def file = output.get().asFile
        file.parentFile.mkdirs()
        file.text = classpath.files.join(File.pathSeparator)
    }
}

// IDEA run configurations live in .run/ (versioned, one folder). ModDevGradle writes a duplicate
// Application copy into .idea/workspace.xml, outside that folder, so its writer is turned off.
tasks.matching { it.name == 'neoForgeIdeSync' }.configureEach { enabled = false }

// Self-check that needs no Minecraft runtime: ./gradlew :<cell>:statsCheck
tasks.register('statsCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the duel-stats self-check against a temporary directory.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.leipishu.pvpocket.stats.DuelStatsCheck'
}
