modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0-only"

[[mods]]
modId = "pvpocket"
version = "${file.jarVersion}"
displayName = "PvPocket"
displayTest = "MATCH_VERSION"
description = '''
Isolated duel sessions for SMP servers: custom loadouts, best-of-N rounds, per-round Legacy 1.8 combat, and a full restore of survival state afterwards.
'''
logoFile = "assets/pvpocket/icon.png"
authors = "leipishu"

# Two mixin configs: one shared by server and client, one client only. NeoForge has no per-config
# environment field, so the client config lists its mixins in the JSON `client` array instead.
[[mixins]]
config = "pvpocket.mixins.json"

[[mixins]]
config = "pvpocket.client.mixins.json"

[[dependencies.pvpocket]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.pvpocket]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"
