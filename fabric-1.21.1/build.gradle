plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "pvpocket" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // Two independent dev clients so a duel can actually be played, plus a dedicated server as the
    // shared room. Three separate run directories are mandatory, not cosmetic:
    //   - Minecraft writes logs/latest.log with a rolling file appender. Two JVMs in one directory
    //     fight over the same file and the loser silently loses its log, which is the main debug
    //     surface for this project.
    //   - options.txt, saves, resource index and screenshots all collide as well.
    // Distinct usernames are equally mandatory: the dev client otherwise logs in as the OS user,
    // so both clients would be the same player and the second join would be rejected.
    runs {
        client {
            client()
            configName = "Minecraft Client (Dev1)"
            runDir "run-client1"
            programArgs "--username", "Dev1"
        }
        client2 {
            client()
            configName = "Minecraft Client (Dev2)"
            runDir "run-client2"
            programArgs "--username", "Dev2"
        }
        server {
            server()
            configName = "Minecraft Server (shared room)"
            runDir "run"
        }
    }
}

// Passing -PquickJoin=localhost:25565 makes both dev clients skip the title screen and connect
// straight to the shared room. Left off by default so a bare `runClient` still starts normally.
def quickJoin = project.findProperty("quickJoin")
if (quickJoin) {
    loom.runs.configureEach { run ->
        if (run.environment == "client") {
            run.programArgs("--quickPlayMultiplayer", quickJoin.toString())
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName
}
