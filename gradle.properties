# Gradle
# Loom 1.11 要求 Gradle 守护进程运行在 JDK 21 上。换机器或接入 CI 时修改此行，
# 或改为在环境中设置 JAVA_HOME 指向 JDK 21 并删除本行。
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# 工具链只认这一个目录。不依赖自动探测：本机 jdk-17 有 javac，但 Gradle 的注册表探测
# 就是没把它列出来（`./gradlew javaToolchains` 只显示 21 / 27 / 8），而 1.20.1 那一格要用 17。
# 显式列出之后，哪一版用哪个 JDK 就完全由代码决定，不再受"这台机器上碰巧探测到什么"影响。
#
# 分工：1.21.x 用 jdk-21；26.x 用 jdk-27 配 `options.release = 25`（没有 JDK 25，也不需要）；
# 1.20.1 用 jdk-17（`common` 的语言级别锁在 17，见 docs 的移植方案）。
org.gradle.java.installations.paths=C:\\Program Files\\Java\\jdk-17,C:\\Program Files\\Java\\jdk-21,C:\\Program Files\\Java\\jdk-27

# 各 cell 的版本号。
#
# 现在只有 1.21.1 两个 cell，所以这些值放在根里没有歧义。**加第二个 Minecraft 版本之前**，它们
# 要搬去 gradle/libs.versions.toml（每个 cell 一行，cell 的 build.gradle 从 catalog 取）——否则
# `minecraft_version` 这个名字会在两个版本之间打架，而打架的表现是「编译过了但类属于另一版」。
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.9
loom_version=1.11.8
fabric_version=0.116.17+1.21.1
neoforge_version=21.1.265
moddev_version=2.0.148

# Loom 下载源
# 曾尝试 BMCLAPI 国内镜像，但其资源与 maven 请求都会 302 到
# *.sakura.sld.tw 的下载节点，该节点证书链无法通过 JDK 校验
# （PKIX path building failed），因此这里保留官方源。
# 如需启用镜像，取消下面四行注释并注释掉官方源：
#   loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
#   loom_resources_base=https://bmclapi2.bangbang93.com/assets/
#   loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest.json
#   loom_experimental_versions=https://maven.fabricmc.net/net/minecraft/experimental_versions.json
loom_libraries_base=https://libraries.minecraft.net/
loom_resources_base=https://resources.download.minecraft.net/
loom_version_manifests=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

# Mod metadata
mod_id=pvpocket
mod_name=PvPocket
mod_version=0.1.0
maven_group=com.leipishu
# 产物名不再写在这里：它由 cell 名派生（1.21.1-fabric → pvpocket-fabric-1.21.1），
# 见 gradle/pvpocket-cells.gradle。写死一个 archives_base_name 就等于让两个 cell 抢同一个名字。
