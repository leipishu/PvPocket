# Gradle. The daemon has to be the newest JVM in play: Loom 1.19 runs on Java 25+, and each cell's
# level comes from the toolchain, so this only decides which JVM runs the build.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-27
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Toolchains come only from these paths: the registry probe misses jdk-17 here. The 26.x cells use
# 25, because NeoForge 26.1's bundled ASM rejects the class files that 27 produces.
org.gradle.java.installations.paths=C:\\Program Files\\Java\\jdk-17,C:\\Program Files\\Java\\jdk-21,C:\\Program Files\\Java\\jdk-25,C:\\Program Files\\Java\\jdk-27

# Loom download sources. The BMCLAPI mirror redirects to a host whose certificate chain fails JDK
# validation (PKIX path building failed), so the official sources are used.
loom_libraries_base=https://libraries.minecraft.net/
loom_resources_base=https://resources.download.minecraft.net/
loom_version_manifests=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

# Mod metadata
mod_id=pvpocket
mod_name=PvPocket
mod_version=0.1.0
maven_group=com.leipishu
